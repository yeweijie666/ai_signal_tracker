<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 硬核信源 · 时间线看板</title>
<script src="https://cdn.jsdelivr.net/npm/@mozilla/readability@0.5.0/Readability.min.js"></script>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1f2329; --sub:#6b7280; --line:#e6e8eb;
    --accent:#2563eb; --accent2:#1d4ed8; --shadow:0 1px 3px rgba(0,0,0,.07);
    --side:#fff; --hover:#eef2ff; --sel:#dbeafe;
    --cX:#2563eb; --cOrg:#d97706; --cPlat:#0f766e; --cCn:#dc2626; --cRss:#7c3aed; --cNews:#16a34a;
  }
  body.dark{--bg:#15171c;--card:#1e2128;--ink:#e5e7eb;--sub:#9aa3af;--line:#2c313a;--shadow:0 1px 3px rgba(0,0,0,.4);
    --side:#1a1d23;--hover:#262b34;--sel:#233048;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;font-size:14px;line-height:1.55}
  /* 布局：左菜单栏 + 中文章列表 + 右正文，分隔条可拖动 */
  #app{display:flex;height:100vh;overflow:hidden}
  aside{width:268px;flex:0 0 auto;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  aside .brand{padding:13px 15px;font-weight:800;font-size:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  aside .brand small{font-weight:500;color:var(--sub);font-size:11px}
  #tree{flex:1;overflow-y:auto;padding:8px 8px 24px}
  #tree::-webkit-scrollbar{width:8px}#tree::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .node{padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px;user-select:none;font-size:13px}
  .node:hover{background:var(--hover)}
  .node.active{background:var(--sel);color:var(--accent2);font-weight:600}
  .node .tw{display:inline-block;width:12px;color:var(--sub);transition:transform .15s;font-size:10px}
  .node.open .tw{transform:rotate(90deg)}
  .cnt{margin-left:auto;font-size:11px;color:var(--sub);background:var(--bg);border-radius:10px;padding:1px 7px}
  .node.active .cnt{background:var(--accent);color:#fff}
  .cathead{font-weight:600}
  .subs{margin-left:6px;border-left:1px solid var(--line);padding-left:4px;display:none}
  .cat.open>.subs{display:block}
  .subs .node{font-size:12.5px;color:var(--sub)}
  .subs .node:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line);margin-right:2px;flex:0 0 5px}
  /* 三级菜单：订阅源下的文章列表 + 已读未读 */
  .srcnode{margin:1px 0}
  .srcnode.open>.arts{display:block}
  .arts{display:none;margin-left:14px;border-left:1px solid var(--line);padding:2px 0 4px 4px;max-height:44vh;overflow-y:auto}
  .arts-head{display:flex;align-items:center;gap:6px;padding:3px 8px;font-size:11px;color:var(--sub)}
  .arts-head .mk{margin-left:auto;font-size:11px;color:var(--accent);cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .artrow{display:flex;align-items:flex-start;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer}
  .artrow:hover{background:var(--hover)}
  .artrow.read .art-title{color:var(--sub);font-weight:400}
  .art-title{font-size:12px;font-weight:600;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .art-sub{font-size:10px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .artmeta{display:flex;flex-direction:column;min-width:0;flex:1}
  .art-empty{font-size:11px;color:var(--sub);padding:4px 10px}
  .rdot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .artrow.read .rdot{background:transparent;border:1px solid var(--sub);box-shadow:none}
  .item.read{border-left:3px solid var(--line)}
  .item.flash{outline:2px solid var(--accent);outline-offset:1px}
  .item .rdbtn{margin-left:auto;font-size:11px;color:var(--accent);cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .item.read .rdbtn{color:var(--sub)}
  /* X 头像墙 */
  .xsec{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  .xgrid{display:none;padding:8px 6px 4px;max-height:340px;overflow-y:auto}
  .xsec.open .xgrid{display:block}
  .xcard{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:8px;cursor:pointer}
  .xcard:hover{background:var(--hover)}
  .xav-wrap{width:34px;height:34px;flex:0 0 34px;border-radius:50%;overflow:hidden;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
  .xav-wrap img{width:100%;height:100%;object-fit:cover}
  .xmeta{display:flex;flex-direction:column;line-height:1.25;min-width:0}
  .xmeta b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .xmeta span{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 主区 */
  main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);align-items:center}
  .toolbar input[type=text]{flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:7px 10px;font-size:13px}
  select,.btn,.theme-btn{border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:7px 9px;font-size:13px}
  .btn{cursor:pointer;font-weight:600}.btn:hover{background:var(--hover)}
  .theme-btn{margin-left:auto;cursor:pointer}
  #scroll{flex:1;overflow-y:auto;max-width:1040px;margin:0 auto;width:100%;padding:14px 18px}
  .crumb{font-size:12px;color:var(--sub);margin:2px 0 12px}
  .dayhdr{font-size:12.5px;font-weight:700;color:var(--sub);margin:16px 0 8px;position:sticky;top:0;background:var(--bg);padding:5px 0;z-index:5;border-bottom:1px dashed var(--line)}
  .item{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .item .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
  .date{font-size:12px;font-weight:700;color:var(--ink);background:var(--hover);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
  .badge{font-size:11px;padding:2px 9px;border-radius:6px;color:#fff;font-weight:600}
  .b-X账号{background:var(--cX)} .b-机构报告{background:var(--cOrg)} .b-硬核平台{background:var(--cPlat)}
  .b-中文资讯{background:var(--cCn)} .b-RSS订阅{background:var(--cRss)} .b-Newsletter{background:var(--cNews)}
  .src{font-size:12px;color:var(--sub)} .author{font-size:12px;color:var(--sub)}
  .title{font-weight:700;font-size:15px;margin:3px 0 7px;color:var(--accent2);text-decoration:none;display:block}
  .title:hover{text-decoration:underline}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cols.one{grid-template-columns:1fr}
  .col-h{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:3px;letter-spacing:.3px}
  .orig{font-size:13.5px;white-space:pre-wrap}
  .zh{font-size:13.5px;background:var(--bg);border-radius:8px;padding:8px 10px;border-left:3px solid var(--accent);white-space:pre-wrap}
  .notr{font-size:12px;color:var(--sub);font-style:italic}
  .togg{font-size:11.5px;color:var(--accent);cursor:pointer;user-select:none;margin-left:6px}
  .empty{text-align:center;color:var(--sub);padding:50px 20px}
  .drop{margin:20px auto;max-width:520px;border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--sub);cursor:pointer}
  .drop:hover{border-color:var(--accent);color:var(--accent)}
  .foot{color:var(--sub);font-size:12px;text-align:center;padding:16px}
  /* 三栏：左菜单(可拖动) / 中列表 / 右阅读(可拖动) */
  #gutter,#gutter2{width:6px;flex:0 0 6px;cursor:col-resize;background:transparent;position:relative;z-index:6;transition:background .15s}
  #gutter:hover,#gutter2:hover,#gutter.drag,#gutter2.drag{background:var(--accent)}
  #listpane{flex:1 1 auto;min-width:260px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
  #contentpane{flex:0 0 440px;display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--line);overflow:hidden}
  body.resizing{cursor:col-resize!important;user-select:none!important}
  .item.active3{outline:2px solid var(--accent);outline-offset:-2px}
  .item .title{cursor:pointer}
  .title .ext{color:var(--sub);font-size:12px;font-weight:400}
  .snip{font-size:12.5px;color:var(--sub);margin:4px 0 2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .orilink{display:inline-block;font-size:11.5px;color:var(--accent);text-decoration:none;margin-top:2px}
  .orilink:hover{text-decoration:underline}
  /* 右阅读栏 */
  #readerHead{padding:11px 14px 10px;border-bottom:1px solid var(--line);position:relative}
  .r-close{position:absolute;top:9px;right:10px;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:13px}
  .r-gear{position:absolute;top:9px;right:44px;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:13px}
  .r-gear:hover{color:var(--accent);border-color:var(--accent)}
  .r-translate{position:absolute;top:9px;right:78px;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:7px;height:26px;padding:0 9px;cursor:pointer;font-size:12px;white-space:nowrap}
  .r-translate:hover{color:var(--accent);border-color:var(--accent)}
  .r-translate:disabled{opacity:.55;cursor:default}
  .r-open{position:absolute;top:9px;right:140px;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:7px;height:26px;padding:0 9px;cursor:pointer;font-size:12px;white-space:nowrap}
  .r-open:hover{color:var(--accent);border-color:var(--accent)}
  .r-listtoggle{position:absolute;top:9px;right:202px;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:7px;height:26px;padding:0 9px;cursor:pointer;font-size:12px;white-space:nowrap}
  .r-listtoggle:hover{color:var(--accent);border-color:var(--accent)}
  body.list-collapsed #listpane{display:none}
  body.list-collapsed #gutter{display:none}
  .r-frame{width:100%;height:100%;border:0;background:#fff;display:block}
  .r-title{display:block;font-weight:700;font-size:15px;color:var(--accent2);text-decoration:none;margin-right:270px;line-height:1.4}
  .r-title:hover{text-decoration:underline}
  .r-meta{font-size:12px;color:var(--sub);margin-top:4px}
  #reader{flex:1;overflow-y:auto;padding:16px 20px;background:var(--card)}
  .r-placeholder{text-align:center;color:var(--sub);padding:70px 24px;line-height:1.8}
  .r-loading{color:var(--sub);font-size:13px;padding:20px 0}
  .r-article{font-size:14.5px;line-height:1.75;color:var(--ink)}
  .r-article :where(h1,h2,h3){margin:1.1em 0 .5em;line-height:1.3}
  .r-article img{max-width:100%;height:auto;border-radius:8px;margin:8px 0}
  .r-article pre{background:var(--bg);padding:10px 12px;border-radius:8px;overflow:auto;font-size:12.5px}
  .r-article a{color:var(--accent)}
  .r-article blockquote{margin:10px 0;padding:4px 12px;border-left:3px solid var(--line);color:var(--sub)}
  .r-via{margin-top:16px;font-size:11.5px;color:var(--sub);border-top:1px dashed var(--line);padding-top:8px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}.xgrid{max-height:none}}
  @media(max-width:620px){aside{position:absolute;z-index:30;height:100%;transform:translateX(-100%);transition:transform .2s}aside.show{transform:none}#menuBtn{display:inline-block!important}}
  @media(max-width:900px){#gutter2{display:none}#contentpane{position:absolute;right:0;top:0;bottom:0;width:100%!important;z-index:40;display:none}}
  #menuBtn{display:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">🛰️ AI 信源时间线 <small id="totalSmall"></small></div>
    <div id="tree"></div>
  </aside>
  <div id="gutter" title="← 拖动调整左侧菜单宽度 →"></div>

  <section id="listpane">
    <div class="toolbar">
      <button id="menuBtn">☰ 分类</button>
      <input type="text" id="search" placeholder="🔍 搜索标题 / 正文 / 来源…">
      <select id="langSel">
        <option value="">全部语言</option><option value="en">仅英文</option><option value="zh">仅中文</option>
      </select>
      <button class="btn" id="zhBtn">译/原 切换</button>
      <button class="btn" id="reloadBtn">↻ 刷新</button>
      <button class="btn" id="collapseBtn">⟨⟨ 折叠</button>
      <button class="btn" id="openBtn">📂 打开</button>
      <input type="file" id="fileIn" accept="application/json" style="display:none">
      <button class="theme-btn" id="themeBtn">🌙 深色</button>
    </div>
    <div id="scroll">
      <div class="crumb" id="crumb">全部信源</div>
      <div id="list"></div>
      <div class="foot">数据由 <code>run.py</code> 每日定时抓取 · 英文已缓存中文译文 · 点击文章标题可在右侧栏阅读去广告正文</div>
    </div>
  </section>

  <div id="gutter2" title="← 拖动调整阅读栏宽度 →"></div>
  <section id="contentpane">
    <div id="readerHead">
      <button class="r-close" id="readerClose" title="关闭阅读栏">✕</button>
      <button class="r-gear" id="readerProxy" title="设置抓取代理（默认用你自己的 Cloudflare Worker）">⚙</button>
      <button class="r-translate" id="readerTranslate" title="一键翻译为简体中文（再点恢复原文）">🌐 翻译</button>
      <button class="r-open" id="readerOpen" title="在第3模块内嵌打开文章原网页">🔗 网页</button>
      <button class="r-listtoggle" id="listToggle" title="折叠/展开中间列表">⟨ 列表</button>
      <a class="r-title" href="#" target="_blank" rel="noopener">选择一篇文章</a>
      <div class="r-meta">点击左侧分类树里的某篇文章，或中间列表的标题，这里会展示抓取并去广告后的正文</div>
    </div>
    <div id="reader"><div class="r-placeholder">👈 点击左侧分类树里的某篇文章，或中间列表的标题，<br>这里将自动抓取原链接、去除导航与广告，呈现干净正文。</div></div>
  </section>
</div>

<script>
// ===== 内置：X 核心信源（无法自动爬取，列出口头像墙，点开直达主页）=====
const X_ACCOUNTS = [
  {h:"karpathy",       n:"Andrej Karpathy", t:"核心大脑",   d:"OpenAI创始成员、前特斯拉AI总监"},
  {h:"sama",           n:"Sam Altman",      t:"核心大脑",   d:"OpenAI CEO"},
  {h:"darioamodei",    n:"Dario Amodei",    t:"核心大脑",   d:"Anthropic CEO"},
  {h:"ylecun",         n:"Yann LeCun",      t:"核心大脑",   d:"Meta首席AI科学家、深度学习先驱"},
  {h:"AndrewYNg",      n:"Andrew Ng",       t:"核心大脑",   d:"DeepLearning.AI 创始人"},
  {h:"simonw",         n:"Simon Willison",  t:"工程与工具", d:"高产技术专家，AI落地实战"},
  {h:"hwchase17",      n:"Harrison Chase",  t:"工程与工具", d:"LangChain CEO"},
  {h:"jerryjliu0",     n:"Jerry Liu",       t:"工程与工具", d:"LlamaIndex 创始人"},
  {h:"rasbt",          n:"Sebastian Raschka",t:"工程与工具",d:"独立研究员，从零实现 LLM"},
  {h:"ID_AA_Carmack",  n:"John Carmack",    t:"工程与工具", d:"传奇程序员"},
  {h:"_akhaliq",       n:"AK",              t:"信号放大器", d:"arXiv 信号放大器"},
  {h:"GergelyOrosz",   n:"Gergely Orosz",   t:"信号放大器", d:"软件工程行业观察"},
  {h:"lexfridman",     n:"Lex Fridman",     t:"信号放大器", d:"MIT研究员、播客主持"},
  {h:"kaifulee",       n:"李开复",          t:"信号放大器", d:"创新工场，全球AI商业"},
  {h:"AnthropicAI",    n:"Anthropic",       t:"信号放大器", d:"Anthropic 官方"},
];
// 分类展示顺序（X账号由头像墙承担，不进可折叠分类树，避免重复）
const CAT_ORDER = ["硬核平台","机构报告","中文资讯","RSS订阅","Newsletter"];
const CAT_COLOR = {"X账号":"b-X账号","机构报告":"b-机构报告","硬核平台":"b-硬核平台",
                   "中文资讯":"b-中文资讯","RSS订阅":"b-RSS订阅","Newsletter":"b-Newsletter"};

let DATA = [];
let ui = {q:"", lang:"", showZh:true, filter:{type:"all"}, sortDesc:true, openCats:new Set(), openSrcs:new Set()};

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmtDate(p){ if(!p) return "未知日期"; const d=(p||"").slice(0,10); return /^\d{4}-\d{2}-\d{2}$/.test(d)? d : "未知日期"; }

// ===== 订阅源文章（三级菜单）+ 已读/未读 =====
const READ_KEY = "rss_read_v1";
let READ = {};
function loadRead(){ try{ READ = JSON.parse(localStorage.getItem(READ_KEY)||"{}")||{}; }catch(e){ READ={}; } }
function saveRead(){ try{ localStorage.setItem(READ_KEY, JSON.stringify(READ)); }catch(e){} }
function isRead(url){ return !!(url && READ[url]); }
function markRead(url){ if(!url || READ[url]) return false; READ[url]=true; saveRead(); return true; }
function unmarkRead(url){ if(!url) return; delete READ[url]; saveRead(); }
// 仅刷新已读/未读圆点，避免重建整个侧栏导致三级菜单折叠
function refreshReadDots(){
  document.querySelectorAll(".artrow").forEach(r=>{
    const read=isRead(r.dataset.url);
    r.classList.toggle("read", read);
    const dot=r.querySelector(".rdot"); if(dot) dot.classList.toggle("on", read);
  });
}
// 点击三级菜单文章 -> 标记已读 + 在右栏加载正文
function openArticle(url){
  if(!url) return;
  const d = DATA.find(x=>x.url===url);
  if(!d) return;
  markRead(url);
  const gi = DATA.indexOf(d);
  if(!document.getElementById("art-"+gi)) setFilter({type:"src", cat:d.category, src:d.source});
  loadArticle(d);
}
function markItemRead(el, url){ if(markRead(url)){ if(el){ const it=el.closest(".item"); if(it) it.classList.add("read"); } refreshReadDots(); } }

// ===== 侧栏构建 =====
function buildSidebar(){
  const present = new Set(DATA.map(d=>d.category));
  let cats = CAT_ORDER.filter(c=>present.has(c));
  [...present].forEach(c=>{ if(!cats.includes(c) && c!=="X账号") cats.push(c); });

  let h = `<div class="node all ${ui.filter.type==="all"?"active":""}" data-f="all">📋 全部信源 <span class="cnt">${DATA.length}</span></div>`;

  // X 头像墙（顶部，默认展开）
  h += `<div class="xsec open">
    <div class="node xhead" id="xhead">🐦 X 核心信源 <span class="cnt">${X_ACCOUNTS.length}</span> <span class="tw" style="transform:rotate(90deg)">▸</span></div>
    <div class="xgrid">` +
    X_ACCOUNTS.map(a=>{
      const letter=(a.h.replace("@","")[0]||"?").toUpperCase();
      return `<div class="xcard" title="${esc(a.n)} · ${esc(a.d)}" onclick="window.open('https://x.com/${esc(a.h.replace('@',''))}','_blank')">
        <div class="xav-wrap"><img src="https://unavatar.io/twitter/${esc(a.h.replace('@',''))}" alt="" onerror="this.style.display='none'">${letter}</div>
        <div class="xmeta"><b>${esc(a.n)}</b><span>@${esc(a.h.replace('@',''))} · ${esc(a.t)}</span></div>
      </div>`;
    }).join("") +

// ===== 第三栏：抓取并提取正文（去除导航/广告）=====
// 借鉴开源算法 Mozilla Readability（Apache-2.0）做正文抽取；跨域优先走【你自己的 Cloudflare Worker 代理】（默认，
// 国内可直连、不限流），不再依赖公共免费代理（corsproxy.io / allorigins 等经常被限流，报 429/408）；
// Worker 不可用时回退 Jina Reader 服务；再失败则显示本地已抓取摘要(zh_text)。
function snippet(d){
  const t=(d.zh_text||d.text||d.zh_title||d.title||"").replace(/\s+/g," ").trim();
  return t.length>160 ? t.slice(0,160)+"…" : t;
}
function sanitize(html){
  return (html||"")
    .replace(/<script[\s\S]*?<\/script>/gi,"")
    .replace(/<style[\s\S]*?<\/style>/gi,"")
    .replace(/<iframe[\s\S]*?<\/iframe>/gi,"")
    .replace(/<noscript[\s\S]*?<\/noscript>/gi,"")
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,"")
    .replace(/javascript:/gi,"");
}
function renderText(t){
  return (t||"").split(/\n{1,}/).map(p=>`<p>${esc(p.trim())}</p>`).join("");
}
// 默认使用你自己托管的 Cloudflare Worker 代理（国内可直连、不限流）。
// 可在阅读栏头部点 ⚙ 修改；留空则回退到下面的默认地址。
const DEFAULT_PROXY="https://workers-playground-noisy-king-727a.yeweijie66.workers.dev/?url=";
function getProxyBase(){
  const v=(localStorage.getItem("dash_proxy")||"").trim();
  return v || DEFAULT_PROXY;
}
function proxyUrl(u){ return getProxyBase()+encodeURIComponent(u); }
const PROXIES=[ proxyUrl ];
let _proxyRateLimitedUntil=0;
async function tryReadability(url){
  if(typeof Readability==="undefined") return null;
  for(const mk of PROXIES){
    try{
      const r=await fetch(mk(url));
      if(r.status===429){ _proxyRateLimitedUntil=Date.now()+5*60e3; continue; }
      if(!r.ok) continue;
      const html=await r.text();
      const doc=new DOMParser().parseFromString(html,"text/html");
      const art=new Readability(doc).parse();
      if(art && art.content && art.content.length>200) return {html:sanitize(art.content), via:"Mozilla Readability（开源）+ 代理"};
    }catch(e){}
  }
  return null;
}
// 识别无效内容（追踪像素 / 登录墙 / 缓存快照 / 过短）
function isJunkContent(t){
  if(!t) return true;
  const L=(t||"").toLowerCase();
  if(L.includes("tracker probe")||L.includes("1x1 image")||L.includes("cached snapshot")||L.includes("consider retry with caching opt-out")) return true;
  const plain=(t||"").replace(/<[^>]+>/g,"").replace(/\s+/g,"").trim();
  return plain.length<120;
}
// 浏览器端结果缓存：避免重复打代理（持久到 localStorage，TTL 控制）
function _artCacheGet(u){
  try{ const s=localStorage.getItem("art_"+u); if(!s) return null; const o=JSON.parse(s); if(o.exp<Date.now()){ localStorage.removeItem("art_"+u); return null; } return o; }catch(e){ return null; }
}
function _artCacheSet(u,o,ttlMs){ try{ o.exp=Date.now()+ttlMs; localStorage.setItem("art_"+u, JSON.stringify(o)); }catch(e){} }
const _artInflight={};
async function extractArticle(url){
  if(!url) return null;
  if(_artInflight[url]) return _artInflight[url];   // 并发去重：快速点击同一篇不重复打代理
  const run=async()=>{
    const c=_artCacheGet(url);
    if(c){ return c.kind==="ok" ? {html:c.html, text:c.text, via:c.via} : null; }
    // 1) 代理 + Readability（代理限流中则跳过，直接走 jina）
    if(_proxyRateLimitedUntil<=Date.now()){
      const a=await tryReadability(url);
      if(a){ const body=a.html||a.text||""; if(!isJunkContent(body)){ _artCacheSet(url,{kind:"ok",html:a.html||"",text:a.text||"",via:a.via},6*3600e3); return a; } _artCacheSet(url,{kind:"invalid"},6*3600e3); return null; }
    }
    // 2) Jina 兜底（不走代理，可绕过被墙目标）
    try{ const r=await fetch("https://r.jina.ai/http://"+url); if(r.ok){ const t=await r.text(); if(t && !isJunkContent(t)){ _artCacheSet(url,{kind:"ok",text:t,via:"Jina Reader 服务"},6*3600e3); return {text:t,via:"Jina Reader 服务"}; } } }catch(e){}
    // 3) 都失败：标记限流/无效，短期内不再重试，直接降级显示本地摘要
    const limited=_proxyRateLimitedUntil>Date.now();
    _artCacheSet(url, {kind:limited?"ratelimit":"invalid"}, limited?5*60e3:30*60e3);
    return null;
  };
  const p=run(); _artInflight[url]=p; p.finally(()=>{ delete _artInflight[url]; });
  return p;
}
// ===== 一键翻译（经自托管代理调 Google 翻译，绕 GFW）=====
function splitForTranslate(text, max){
  const out=[]; let i=0;
  while(i<text.length){
    let end=Math.min(i+max, text.length);
    if(end<text.length){
      let j=end;
      while(j>i+max*0.6 && !/[。.!?！？\n]/.test(text[j])) j--;
      if(j>i+max*0.6) end=j+1;
    }
    out.push(text.slice(i,end)); i=end;
  }
  return out;
}
async function translateChunk(text){
  const u=proxyUrl("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q="+encodeURIComponent(text));
  const r=await fetch(u); if(!r.ok) throw new Error("翻译接口返回 "+r.status);
  const j=await r.json();
  let out=""; for(const seg of (j[0]||[])){ if(seg && seg[0]) out+=seg[0]; }
  return out;
}
let _translating=false;
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); }
function applyTranslated(reader,art,joined,btn){
  const html=joined.split(/\n{1,}/).map(p=>`<p>${esc(p.trim())}</p>`).join("")
    +`<div class="r-via">已译为简体中文（🌐 一键翻译，再次点击恢复原文）</div>`;
  art.innerHTML=html; reader.dataset.translated="1"; btn.textContent="↺ 原文";
}
async function doTranslate(){
  if(_translating) return;
  const reader=document.getElementById("reader");
  const art=reader.querySelector(".r-article");
  const btn=document.getElementById("readerTranslate");
  if(!art){ alert("请先打开一篇文章再翻译。"); return; }
  if(reader.dataset.translated==="1"){
    art.innerHTML=reader.dataset.origHtml||"";
    reader.dataset.translated="0"; btn.textContent="🌐 翻译"; return;
  }
  reader.dataset.origHtml=art.innerHTML;
  const plain=(art.innerText||art.textContent||"").replace(/[ \t]+\n/g,"\n").trim();
  if(!plain){ alert("当前正文无可翻译的文本。"); return; }
  // 命中本地译文缓存：同一正文不再打代理
  const cacheKey="tr_"+hashStr(plain);
  const cached=localStorage.getItem(cacheKey);
  if(cached){ applyTranslated(reader,art,cached,btn); return; }
  // 代理限流中：直接提示，避免反复请求放大 429
  if(_proxyRateLimitedUntil>Date.now()){
    const left=Math.ceil((_proxyRateLimitedUntil-Date.now())/1000);
    alert("抓取/翻译代理暂时限流（429），请 "+left+" 秒后再试，或检查 ⚙ 代理设置。"); return;
  }
  const chunks=splitForTranslate(plain,4000);
  _translating=true; btn.disabled=true; btn.textContent="⏳ 翻译中…";
  try{
    const parts=[];
    for(let i=0;i<chunks.length;i++){
      btn.textContent=`⏳ 翻译中 ${i+1}/${chunks.length}…`;
      parts.push(await translateChunk(chunks[i]));
    }
    const joined=parts.join("\n\n");
    try{ localStorage.setItem(cacheKey, joined); }catch(e){}
    applyTranslated(reader,art,joined,btn);
  }catch(e){
    const msg=e.message||String(e);
    if(/429/.test(msg)){ _proxyRateLimitedUntil=Date.now()+5*60e3; alert("翻译代理返回 429（限流），请 5 分钟后再试，或检查 ⚙ 代理设置。"); }
    else alert("翻译失败："+msg+"\n请检查 ⚙ 代理设置（需能访问 Google 翻译）。");
    btn.textContent="🌐 翻译";
  }finally{
    _translating=false; btn.disabled=false;
  }
}

function showReader(){ const c=document.getElementById("contentpane"); if(c) c.style.display="flex"; }

async function loadArticle(d){
  if(!d) return;
  highlightActive(d.url);
  markRead(d.url); refreshReadDots();
  const head=document.getElementById("readerHead");
  const reader=document.getElementById("reader");
  const gi=DATA.indexOf(d);

  reader.dataset.curUrl=d.url;
  // 优先使用服务端已抓取并清洗过的正文（含图片），无需再走浏览器代理
  if(d.content && (d.content||"").trim().length>120){
    reader.innerHTML=`<div class="r-article">${sanitize(d.content)}</div><div class="r-via">内容提取来源：服务端全文抓取（已缓存）</div>`;
    showReader();
    return;
  }
  reader.innerHTML='<div class="r-loading">⏳ 正在抓取并提取正文（去除导航与广告）…</div>';
  showReader();
  const my=++_readerBusy;
  const res=await extractArticle(d.url);
  if(my!==_readerBusy) return; // 已被新的点击覆盖
  if(res && (res.html||res.text)){
    const bodyHtml = res.html ? res.html : renderText(res.text);
    reader.innerHTML=`<div class="r-article">${bodyHtml}</div><div class="r-via">内容提取来源：${esc(res.via)}</div>`;
  }else{
    const body=(d.zh_text||d.text||d.zh_title||d.title||"（本地无摘要，且在线抓取失败）");
    reader.innerHTML=`<div class="r-article">${esc(body)}</div><div class="r-via">⚠️ 在线抓取失败，显示本地已抓取内容（${esc(d.source||"")}）。多为目标站反爬/动态加载（如 Twitch），或代理临时限流；可点右上角 🔗 网页 直接在内嵌打开原页面。</div>`;
  }
}

// 分隔条拖动：sidebar 宽度、contentpane 宽度，宽度持久化
function initResize(){
  const sb=document.getElementById("sidebar");
  const cp=document.getElementById("contentpane");
  const w1=localStorage.getItem("dash_side_w"); if(w1) sb.style.width=w1;
  const w2=localStorage.getItem("dash_read_w"); if(w2) cp.style.width=w2;
  function drag(gutter, target, storeKey, grow){
    gutter.addEventListener("mousedown", e=>{
      e.preventDefault();
      document.body.classList.add("resizing");
      gutter.classList.add("drag");
      const startX=e.clientX;
      const startW=target.getBoundingClientRect().width;
      function move(ev){
        let dx=ev.clientX-startX;
        let w=grow ? startW+dx : startW-dx;
        w=Math.max(grow?180:320, Math.min(grow?460:820, w));
        target.style.width=w+"px";
      }
      function up(){
        document.removeEventListener("mousemove",move);
        document.removeEventListener("mouseup",up);
        document.body.classList.remove("resizing");
        gutter.classList.remove("drag");
        localStorage.setItem(storeKey, target.style.width);
      }
      document.addEventListener("mousemove",move);
      document.addEventListener("mouseup",up);
    });
  }
  drag(document.getElementById("gutter"), sb, "dash_side_w", true);   // 向左拖增大左栏
  drag(document.getElementById("gutter2"), cp, "dash_read_w", false);  // 向左拖增大右栏
}

document.getElementById("openBtn").onclick=()=>document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ loadData(JSON.parse(r.result)); }catch(_){ alert("JSON 解析失败"); } }; r.readAsText(f); };
document.getElementById("themeBtn").onclick=()=>{ document.body.classList.toggle("dark"); localStorage.setItem("dash_theme", document.body.classList.contains("dark")?"dark":"light"); document.getElementById("themeBtn").textContent=document.body.classList.contains("dark")?"☀️ 浅色":"🌙 深色"; };
document.getElementById("menuBtn").onclick=()=>document.querySelector("aside").classList.toggle("show");
if(localStorage.getItem("dash_theme")==="dark"){ document.body.classList.add("dark"); document.getElementById("themeBtn").textContent="☀️ 浅色"; }

loadRead();
initResize();
document.getElementById("readerClose").onclick=()=>{ document.getElementById("contentpane").style.display="none"; };
document.getElementById("readerProxy").onclick=()=>{
  const cur=getProxyBase();
  const tip="设置抓取代理（CORS 代理）基础地址，需以 ?url= 结尾，例如：\nhttps://你的worker.workers.dev/?url=\n（留空则恢复默认的 Cloudflare Worker）";
  const v=prompt(tip, cur);
  if(v===null) return;
  const t=v.trim();
  if(!t){ localStorage.removeItem("dash_proxy"); alert("已恢复默认代理（你自己的 Cloudflare Worker）。"); return; }
  let base=t;
  if(!/url=/.test(base)){ base += (base.includes("?")?"&":"?")+"url="; }
  localStorage.setItem("dash_proxy", base);
  alert("代理已保存："+base+"\n下次抓取生效（当前文章重新点击即可）。");
};
document.getElementById("readerTranslate").onclick=doTranslate;
document.getElementById("readerOpen").onclick=openInFrame;
document.getElementById("listToggle").onclick=toggleList;
document.getElementById("collapseBtn").onclick=toggleList;
fetchData();
</script>
</body>
</html>
